services:
  mediaproxy:
    image: ghcr.io/skidoodle/mediaproxy
    container_name: mediaproxy
    ports:
      - "8080:8080"
    restart: unless-stopped
    environment:
      - CACHE_TTL=30m
      - ALLOWED_DOMAINS=images.unsplash.com,static.pexels.com,*.example.com
      - DEFAULT_IMAGE_QUALITY=100
      - MAX_ALLOWED_SIZE=10485760
      - CLIENT_TIMEOUT=120s
